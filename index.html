<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Constellation: A 3D Space Puzzle</title>
  <link rel="stylesheet" href="styles.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas"></canvas>
    
    <div id="ui-overlay">
      <div id="welcome-screen" class="screen">
        <h1>Constellation</h1>
        <p>A collaborative 3D space puzzle</p>
        <div class="form-container">
          <input type="text" id="username-input" placeholder="Enter your username" maxlength="15">
          <button id="start-button">Join the Stars</button>
        </div>
      </div>
      
      <div id="game-ui" class="hidden">
        <div id="top-bar">
          <div id="constellation-goal">
            <span>Current Goal:</span>
            <span id="constellation-name">Orion</span>
          </div>
          <div id="timer">Time: <span id="time-left">120</span>s</div>
          <div id="players-counter">Players: <span id="player-count">1</span></div>
        </div>
        <div id="controls-hint" class="hint-box">
          <p>Move: W,A,S,D or Arrow Keys | Connect Stars: Click and drag</p>
        </div>
      </div>
      
      <div id="completion-screen" class="screen hidden">
        <h2>Constellation Complete!</h2>
        <p>You and <span id="completion-player-count">0</span> others connected the stars.</p>
        <button id="play-again-button">Play Again</button>
      </div>
    </div>
  </div>

  <script type="module" src="config.js"></script>
  <script type="module" src="game.js"></script>

</body>
</html>
